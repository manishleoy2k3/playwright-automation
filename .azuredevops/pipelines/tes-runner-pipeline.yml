trigger: none

variables:
  - group: HWS-UI-TESTS

parameters:
  - name: browser
    displayName: 'Browser'
    type: string
    default: 'chromium'
    values:
      - chromium
      - firefox
      - webkit
      - mobile_Chrome
      - mobile_Safari
  - name: environment
    displayName: 'Environment'
    type: string
    default: 'stg'
    values:
      - dev
      - stg
      - prd
  - name: countries
    displayName: 'Countries to test (comma-separated, e.g. "de,fr,it")'
    type: string
    default: 'de'
  - name: tags
    displayName: 'Tag IDs (default: all, space or comma separated, example: ZMC,HOM)'
    type: string
    default: 'all'
  - name: testfolders
    displayName: 'Test folders (default: tests, space-separated, example: tests/e2e tests/features/homePage.spec.ts)'
    type: string
    default: 'tests'

name: Test-Runner-for-selected-tests-${{ parameters.countries }}

stages:
- stage: TestRunner
  displayName: 'Run selected Playwright tests'
  jobs:
    - ${{ each country in split(parameters.countries, ',') }}:
        - job: TestRunner_${{ country }}
          displayName: 'Test Runner - ${{ country }}'
          pool:
            name: hCRE-Scaling-Agents
            demands: AGENT_ENVIRONMENT_LABEL -equals stg
          steps:
            - task: UseNode@1
              inputs:
                version: '20.x'
              displayName: 'Install Node.js'

            - script: npm ci
              displayName: 'npm ci'

            - script: |
                case '${{ parameters.browser }}' in
                  chromium|mobile_Chrome)
                    browser='chromium'
                    ;;
                  firefox)
                    browser='firefox'
                    ;;
                  webkit|mobile_Safari)
                    browser='webkit'
                    ;;
                  *)
                    echo "Unsupported browser project: ${{ parameters.browser }}"
                    exit 1
                    ;;
                esac

                # Linux dependencies must be provisioned in the self-hosted agent image.
                # --with-deps attempts to elevate with sudo/su, which is not available to
                # the unprivileged Azure Pipelines agent user.
                npx playwright install "$browser"
              displayName: 'Install required Playwright browser'

            - script: |
                test_targets='${{ parameters.testfolders }}'

                read -ra playwright_args <<< "$test_targets"
                playwright_args+=("--project=${{ parameters.browser }}")

                tag_filter='${{ parameters.tags }}'
                if [[ "$tag_filter" != 'all' ]]; then
                  tag_filter="${tag_filter//|/ }"
                  tag_filter="${tag_filter//,/ }"
                  read -ra tag_ids <<< "$tag_filter"
                  tag_filter=''
                  for tag_id in "${tag_ids[@]}"; do
                    tag_filter+="@\\[$tag_id\\]|"
                  done
                  tag_filter="${tag_filter%|}"
                  playwright_args+=("--grep=$tag_filter")
                fi

                npx playwright test "${playwright_args[@]}"
              displayName: 'Run selected Playwright tests'
              env:
                CI: 'true'
                SITE_ENV: ${{ parameters.environment }}
                SITE_COUNTRY: ${{ country }}
                TEST_MANAGEMENT_TOKEN: $(TEST_MANAGEMENT_TOKEN)
                TEST_USER_PASSWORD: $(TEST_USER_PASSWORD)
                COMMERCETOOLS_BASIC_AUTH: $(COMMERCETOOLS_BASIC_AUTH)
                STOREFRONT_USERNAME: $(STOREFRONT_USERNAME)
                STOREFRONT_DEV_PASSWORD: $(STOREFRONT_DEV_PASSWORD)
                STOREFRONT_STG_PASSWORD: $(STOREFRONT_STG_PASSWORD)

            - task: PublishPipelineArtifact@1
              displayName: 'Publish Allure results'
              continueOnError: true
              inputs:
                targetPath: allure-results
                artifact: allure-results-${{ country }}
                publishLocation: 'pipeline'
              condition: succeededOrFailed()

            - task: PublishAllureReport@1
              displayName: 'Publish Allure report'
              continueOnError: true
              inputs:
                testResultsDir: allure-results
                includeAttachments: true
                reportName: 'Test Runner Report - ${{ country }}'
              condition: succeededOrFailed()

            - task: PublishTestResults@2
              displayName: 'Publish Test Results'
              inputs:
                testResultsFormat: 'JUnit'
                testResultsFiles: '**/junit-results.xml'
                testRunTitle: 'Test Runner Report - ${{ country }}'
                mergeTestResults: true
                failTaskOnFailedTests: true
              condition: succeededOrFailed()
