# Prettier configuration for consistent code formatting
# See: https://prettier.io/docs/en/configuration.html

# Core formatting options
semi: true
singleQuote: true
quoteProps: "as-needed"
trailingComma: "es5"
tabWidth: 2
useTabs: false
printWidth: 100
bracketSpacing: true
bracketSameLine: false
arrowParens: "avoid"

# TypeScript specific
parser: "typescript"

# File type specific overrides
overrides:
  - files: "*.json"
    options:
      parser: "json"
      
  - files: "*.md"
    options:
      parser: "markdown"
      proseWrap: "preserve"
      
  - files: "*.yaml"
    options:
      parser: "yaml"
      
  - files: "*.yml"  
    options:
      parser: "yaml"

# End of line handling
endOfLine: "lf"

# HTML whitespace sensitivity
htmlWhitespaceSensitivity: "css"

# Vue file support (if needed in the future)
vueIndentScriptAndStyle: false
